# ST Atlas edge proxy. Runs unprivileged on :8080; only this container publishes a port.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log    /dev/stdout;
    sendfile      on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Brute-force dampening in front of the backend's own limits (T-02).
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    upstream backend { server backend:8081; }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        client_max_body_size 30m;

        location = /healthz { access_log off; return 200 "ok\n"; }

        location = /api/v1/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://backend;
            include /etc/nginx/proxy.conf;
        }

        location /api/ {
            proxy_pass http://backend;
            include /etc/nginx/proxy.conf;
        }

        # The backend exposes health only; everything else under /actuator stays internal.
        location /actuator/ { return 404; }

        # ES module assets (e.g. the PDF.js worker). nginx's bundled mime.types
        # has no .mjs entry, so without this it falls back to default_type and the
        # browser refuses the module under nosniff. Must be served as JavaScript.
        location ~* \.mjs$ {
            include /etc/nginx/security-headers.conf;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
